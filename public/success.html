<!-- success.html — ZipPixel (v14)
     ✅ Uses /api/status/:jobId (webhook-driven PAID state)
     ✅ Matches v14 CSS (legalPage / legalHeader / legalCard)
     ✅ Avoids UI bouncing between states while polling
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Success — ZipPixel</title>
  <meta name="description" content="Payment confirmed. Your ZIP will be ready to download shortly." />
  <link rel="canonical" href="https://zippixel.it.com/success" />

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="stylesheet" href="/style.css?v=14" />
</head>

<body>
  <header class="top">
    <div class="container top__inner">
      <a class="brand" href="/" aria-label="ZipPixel home">
        <span class="brand__logo" aria-hidden="true">
          <img src="/favicon.svg?v=1" alt="ZipPixel" width="34" height="34" />
        </span>
        <span class="brand__text">
          <span class="brand__name">ZipPixel</span>
          <span class="brand__sub">Compress files → one ZIP</span>
        </span>
      </a>

      <nav class="nav" aria-label="Site">
        <a href="/">Tool</a>
        <a href="/pricing">Pricing</a>
        <a href="/#faq">FAQ</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </nav>

      <div class="top__cta">
        <a class="btn btn--soft btn--sm" href="/">Back to tool</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="legalPage">
      <div class="container">
        <div class="legalHeader">
          <div class="legalKicker">Payment</div>
          <h1 class="legalTitle">You’re all set.</h1>
          <p class="legalMeta" id="sub">Confirming payment…</p>
        </div>

        <article class="legalCard">
          <p class="legalIntro" id="desc">
            We’re confirming your payment and preparing your ZIP.
          </p>

          <div class="successActions" id="actions" aria-live="polite"></div>

          <p class="fineprint" id="hint">
            If this takes more than ~30 seconds, use “Check again”.
          </p>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div>© <span id="y"></span> ZipPixel</div>
      <div class="footer__links">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    const qs = new URLSearchParams(location.search);
    const jobId = (qs.get("jobId") || "").trim();

    const actions = document.getElementById("actions");
    const sub = document.getElementById("sub");
    const desc = document.getElementById("desc");
    const hint = document.getElementById("hint");

    const setActions = (html) => { actions.innerHTML = html; };

    const supportHtml = `Support: <a href="mailto:support@zippixel.it.com">support@zippixel.it.com</a>`;

    const downloadUrl = jobId ? `/api/download/${encodeURIComponent(jobId)}` : "#";
    const statusUrl = jobId ? `/api/status/${encodeURIComponent(jobId)}` : "#";

    const safeCopy = async (text) => {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "true");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        } catch {
          return false;
        }
      }
    };

    // ---- edge case: missing jobId
    if (!jobId) {
      sub.textContent = "We couldn’t find your job.";
      desc.textContent = "Open ZipPixel and try again. If this keeps happening, email support.";
      hint.innerHTML = supportHtml;
      setActions(`
        <a class="btn btn--primary" href="/">Go to ZipPixel</a>
        <a class="btn btn--soft" href="/privacy">Privacy</a>
      `);
    } else {
      const maxMs = 30000;
      const start = Date.now();
      let attempt = 0;

      // waiting | notPaid | ready | failed
      let mode = "waiting";

      const renderWaiting = (msg) => {
        mode = "waiting";
        sub.textContent = "Confirming payment…";
        desc.textContent = msg || "This usually takes a few seconds.";
        hint.textContent = "If this takes more than ~30 seconds, use “Check again”.";

        setActions(`
          <button class="btn btn--primary" id="retryBtn" type="button">Check again</button>
          <a class="btn btn--soft" href="/">Back to ZipPixel</a>
        `);

        const b = document.getElementById("retryBtn");
        if (b) b.onclick = () => poll(true);
      };

      const renderNotPaid = () => {
        mode = "notPaid";
        sub.textContent = "Payment not confirmed yet.";
        desc.textContent = "If you just paid, it can take a moment. If you cancelled, head back and try again.";
        hint.innerHTML = supportHtml;

        setActions(`
          <a class="btn btn--primary" href="/">Back to ZipPixel</a>
          <a class="btn btn--soft" href="/pricing">View pricing</a>
          <button class="btn btn--ghost" id="retryBtn3" type="button">Check again</button>
        `);

        const b = document.getElementById("retryBtn3");
        if (b) b.onclick = () => poll(true);
      };

      const renderFailed = () => {
        mode = "failed";
        sub.textContent = "Still not ready.";
        desc.textContent = "Refresh once. If it still fails, email support and we’ll sort it.";
        hint.innerHTML = supportHtml;

        setActions(`
          <a class="btn btn--primary" href="${downloadUrl}">Try download</a>
          <button class="btn btn--soft" id="retryBtn2" type="button">Check again</button>
        `);

        const b = document.getElementById("retryBtn2");
        if (b) b.onclick = () => poll(true);
      };

      const renderReady = (shareToken) => {
        mode = "ready";
        sub.textContent = "Your ZIP is ready.";
        desc.textContent = shareToken
          ? "Download the ZIP, or copy a shareable link to send it to a client."
          : "Download your ZIP below.";

        let shareHtml = "";
        if (shareToken) {
          const link = `${location.origin}/s/${shareToken}`;
          const safe = link.replace(/"/g, "&quot;");

          shareHtml = `
            <div class="shareBox">
              <div class="shareLabel">Shareable link</div>
              <div class="shareRow">
                <input class="shareInput" id="shareInput" value="${safe}" readonly />
                <button class="btn btn--soft btn--sm" id="copyBtn" type="button">Copy</button>
              </div>
              <div class="shareHint" id="copyHint">Anyone with the link can download while it remains available.</div>
            </div>
          `;
        }

        setActions(`
          <a class="btn btn--primary" href="${downloadUrl}">Download ZIP</a>
          ${shareHtml}
          <a class="btn btn--soft" href="/">Back to ZipPixel</a>
        `);

        if (shareToken) {
          const link = `${location.origin}/s/${shareToken}`;
          const copyBtn = document.getElementById("copyBtn");
          const copyHint = document.getElementById("copyHint");

          copyBtn?.addEventListener("click", async () => {
            const ok = await safeCopy(link);
            if (copyHint) copyHint.textContent = ok ? "Copied ✅" : "Couldn’t copy — select the link and copy manually.";
          });
        }

        hint.textContent = "Tip: Download promptly and store the ZIP somewhere safe.";
      };

      const checkStatus = async () => {
        try {
          const r = await fetch(statusUrl, { cache: "no-store" });
          if (!r.ok) return { ok: false, paid: false, status: "UNKNOWN", shareToken: null };
          const j = await r.json();
          return {
            ok: !!j.ok,
            paid: !!j.paid,
            status: j.status || "UNKNOWN",
            shareToken: j.shareToken || null
          };
        } catch {
          return { ok: false, paid: false, status: "UNKNOWN", shareToken: null };
        }
      };

      const sleep = (ms) => new Promise(res => setTimeout(res, ms));

      const poll = async (manual = false) => {
        attempt++;
        const waited = Date.now() - start;

        if (manual) {
          renderWaiting("Checking…");
        }

        const st = await checkStatus();

        if (st.paid) return renderReady(st.shareToken);

        if (waited > 6000) {
          if (mode !== "notPaid") renderNotPaid();
        } else {
          if (mode !== "waiting") renderWaiting("Checking your payment…");
        }

        if (waited >= maxMs) return renderFailed();

        const delay = Math.min(2500, 800 + attempt * 350);

        if (mode === "waiting") {
          renderWaiting(`Not ready yet. Retrying in ${(delay/1000).toFixed(1)}s…`);
        }

        await sleep(delay);
        return poll(false);
      };

      renderWaiting("Checking your payment…");
      poll(false);
    }
  </script>
</body>
</html>
