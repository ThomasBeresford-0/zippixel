<!-- public/index.html — PDFOperations (v51 - CLEAN THUMB PREVIEW STABLE)
     ✅ Thumbnail preview (page 1 only)
     ✅ disableWorker true (production-safe)
     ✅ Compression dropdown force hidden
     ✅ No native file picker UI
     ✅ Drag & drop supported
     ✅ All app.js v17.7 IDs preserved
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Compress PDF Online | PDFOperations</title>
  <meta name="description" content="Compress a PDF for strict upload limits." />
  <link rel="canonical" href="https://pdfoperations.com/" />

  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#0b1220" />

  <link rel="stylesheet" href="/style.css?v=36" />

  <style>
    /* HARD KILL compression dropdown */
    #pdfCompressRow,
    #pdfCompressLevel{
      display:none !important;
      visibility:hidden !important;
      height:0 !important;
      overflow:hidden !important;
    }

    /* hide native file input UI */
    .filePick{ position:relative; display:inline-block; }
    #files{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
      width:100%;
      height:100%;
      z-index:5;
    }

    #dropzone.isDragOver{
      outline:3px solid rgba(0,0,0,.08);
      box-shadow:0 12px 40px rgba(0,0,0,.08);
    }

    .previewWrap{
      margin-top:16px;
      border:1px solid rgba(0,0,0,.1);
      border-radius:16px;
      overflow:hidden;
      background:#fff;
    }

    .previewHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 16px;
      border-bottom:1px solid rgba(0,0,0,.08);
      background:#f6f7fb;
    }

    .previewMeta{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }

    .previewName{
      font-weight:600;
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:60ch;
    }

    .previewSub{
      font-size:12px;
      color:#666;
    }

    .previewBody{
      padding:20px;
      display:flex;
      justify-content:center;
    }

    .thumbShell{
      border:1px solid rgba(0,0,0,.1);
      border-radius:12px;
      overflow:hidden;
      background:#fff;
      max-width:240px;
      width:100%;
    }

    canvas#pdfThumb{
      width:100%;
      height:auto;
      display:block;
    }

    .thumbLoading,
    .thumbError{
      padding:24px;
      font-size:13px;
      color:#666;
      text-align:center;
    }

    [hidden]{ display:none !important; }
  </style>
</head>

<body class="page pageCompressPdf">

<header class="nav">
  <div class="container navInner">
    <a class="brand" href="/">PDFOperations</a>
  </div>
</header>

<main>
<section class="hero heroPremium heroToolFirst">
<div class="container heroWide">

<div id="tool" class="tool toolPremium toolMega">

  <h1>Compress PDF</h1>

  <!-- STATUS -->
  <div class="statusWrap">
    <div id="status">Ready</div>
  </div>

  <!-- Required mode controls (hidden) -->
  <fieldset style="display:none;">
    <input type="radio" name="mode" id="modeCompressPdf" checked>
  </fieldset>

  <!-- Required hidden compression select -->
  <div id="pdfCompressRow">
    <select id="pdfCompressLevel">
      <option value="balanced" selected>Balanced</option>
    </select>
  </div>

  <!-- DROPZONE -->
  <div id="dropzone" class="dropzone dropzonePremium dropzoneMega">
    <div class="dzCenter">
      <div>Drop a PDF here</div>
      <div class="filePick">
        <button id="chooseBtn" class="btnPrimary">Select PDF</button>
        <input id="files" type="file" accept="application/pdf" />
      </div>
    </div>

    <!-- app.js hooks -->
    <div id="fileMeta" hidden>
      <div id="fileSummary"></div>
      <button id="clearBtn">Clear</button>
    </div>
  </div>

  <!-- THUMB PREVIEW -->
  <div class="previewWrap" id="pdfPreviewWrap" hidden>
    <div class="previewHead">
      <div class="previewMeta">
        <div class="previewName" id="pdfPreviewName"></div>
        <div class="previewSub">Preview (page 1)</div>
      </div>
      <button id="previewClearBtn">Clear</button>
    </div>

    <div class="previewBody">
      <div class="thumbShell">
        <div class="thumbLoading" id="thumbLoading">Rendering preview…</div>
        <canvas id="pdfThumb" hidden></canvas>
        <div class="thumbError" id="thumbError" hidden>Couldn’t render preview.</div>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actionRow">
    <button id="upload" disabled>Upload PDF</button>
    <button id="continue" disabled>Continue →</button>
  </div>

</div>
</div>
</section>
</main>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>

<script>
(() => {

  const dropzone = document.getElementById("dropzone");
  const input = document.getElementById("files");

  const wrap = document.getElementById("pdfPreviewWrap");
  const nameEl = document.getElementById("pdfPreviewName");
  const canvas = document.getElementById("pdfThumb");
  const loading = document.getElementById("thumbLoading");
  const errorEl = document.getElementById("thumbError");

  const previewClear = document.getElementById("previewClearBtn");
  const appClear = document.getElementById("clearBtn");

  const ctx = canvas.getContext("2d", { alpha:false });

  function fmtMB(bytes){
    return (bytes/1024/1024).toFixed(2) + " MB";
  }

  async function renderThumb(file){
    wrap.hidden = false;
    canvas.hidden = true;
    errorEl.hidden = true;
    loading.hidden = false;

    nameEl.textContent = file.name + " • " + fmtMB(file.size);

    try{
      const buf = await file.arrayBuffer();

      const doc = await pdfjsLib.getDocument({
        data: buf,
        disableWorker: true   // IMPORTANT FIX
      }).promise;

      const page = await doc.getPage(1);
      const viewport = page.getViewport({ scale: 1.5 });

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      ctx.fillStyle = "#fff";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      await page.render({ canvasContext: ctx, viewport }).promise;

      loading.hidden = true;
      canvas.hidden = false;

    }catch(e){
      console.warn("Preview error:", e);
      loading.hidden = true;
      errorEl.hidden = false;
    }
  }

  input.addEventListener("change", () => {
    const file = input.files[0];
    if(file) renderThumb(file);
  });

  dropzone.addEventListener("dragover", e => {
    e.preventDefault();
    dropzone.classList.add("isDragOver");
  });

  dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("isDragOver");
  });

  dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.classList.remove("isDragOver");

    const file = e.dataTransfer.files[0];
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    input.dispatchEvent(new Event("change",{bubbles:true}));
  });

  previewClear.addEventListener("click", () => {
    if(appClear) appClear.click();
    wrap.hidden = true;
    canvas.hidden = true;
    loading.hidden = false;
    errorEl.hidden = true;
    input.value = "";
  });

})();
</script>

<script src="/app.js?v=17.7" defer></script>
</body>
</html>
