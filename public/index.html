<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ZipPixel – Compress Images into a ZIP Instantly</title>
  <meta name="description" content="Upload images, pay once, download a ZIP instantly. No signup. Fast image compression." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<header>
  <h1>ZipPixel</h1>
  <p>Upload images → Pay £4.99 → Download ZIP instantly</p>
</header>

<main>
  <button id="start">Start</button>

  <div id="flow" hidden>
    <input type="file" id="files" multiple accept="image/*" />
    <button id="upload">Upload</button>
    <button id="pay" disabled>Pay £4.99</button>
    <p id="status"></p>
  </div>
</main>

<footer>
  <p>Private. One-time payment. Files deleted automatically.</p>
</footer>

<script>
let jobId;
const status = msg => document.getElementById("status").textContent = msg;

document.getElementById("start").onclick = async () => {
  const r = await fetch("/api/jobs", { method: "POST" }).then(r => r.json());
  jobId = r.jobId;
  document.getElementById("flow").hidden = false;
  status("Choose images.");
};

document.getElementById("upload").onclick = async () => {
  const fd = new FormData();
  for (const f of files.files) fd.append("images", f);
  const r = await fetch(`/api/jobs/${jobId}/upload`, { method: "POST", body: fd }).then(r => r.json());
  status(`Uploaded ${r.fileCount} images`);
  pay.disabled = false;
};

document.getElementById("pay").onclick = async () => {
  const r = await fetch("/api/checkout", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jobId })
  }).then(r => r.json());
  location.href = r.url;
};
</script>

</body>
</html>
