<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PDFOperations">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#000"></rect>

  <!-- Bold "P" monogram (reads at 16px) -->
  <path fill="#fff" d="M18 16h16c8.3 0 14 5.1 14 12.5S42.3 41 34 41H28v9c0 2.2-1.8 4-4 4h-2c-2.2 0-4-1.8-4-4V20c0-2.2 1.8-4 4-4zm10 8v9h6c3.2 0 5.5-1.9 5.5-4.6S37.2 24 34 24h-6z"></path>

  <!-- Gear "bite" (simple notch ring) -->
  <g transform="translate(46 46)">
    <!-- outer ring -->
    <circle r="9" fill="none" stroke="#fff" stroke-width="4"></circle>
    <!-- 4 chunky teeth -->
    <g fill="#fff">
      <rect x="-2" y="-14" width="4" height="6" rx="1"></rect>
      <rect x="-2" y="8" width="4" height="6" rx="1"></rect>
      <rect x="-14" y="-2" width="6" height="4" rx="1"></rect>
      <rect x="8" y="-2" width="6" height="4" rx="1"></rect>
    </g>
    <!-- hub -->
    <circle r="2.5" fill="#fff"></circle>
  </g>
</svg>