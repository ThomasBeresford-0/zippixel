<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Download files • ZipPixel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="robots" content="noindex, nofollow" />

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0ea5e9;
      --accent-soft: #e0f2fe;
      --border: #e5e7eb;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .stat {
      display: inline-block;
      background: var(--accent-soft);
      color: #0369a1;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: transform .05s ease, box-shadow .05s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(14, 165, 233, 0.25);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error {
      color: var(--danger);
      font-weight: 600;
      margin-top: 6px;
    }

    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Files ready to download</h1>

    <div id="meta" class="meta">Loading…</div>
    <div id="stat" class="stat" style="display:none"></div>

    <a id="downloadBtn" class="btn" href="#" disabled>
      Download ZIP
    </a>

    <div id="error" class="error" style="display:none"></div>

    <div class="footer">
      Prepared with <strong>ZipPixel</strong><br />
      <a href="/" target="_blank" rel="noopener">Create your own secure download</a>
    </div>
  </div>

  <script>
    const token = location.pathname.split("/").pop();

    const metaEl = document.getElementById("meta");
    const statEl = document.getElementById("stat");
    const btn = document.getElementById("downloadBtn");
    const errorEl = document.getElementById("error");

    const fail = (msg) => {
      metaEl.textContent = "This link is no longer available.";
      errorEl.textContent = msg || "The download link may have expired.";
      errorEl.style.display = "block";
      btn.style.display = "none";
    };

    if (!token) {
      fail("Invalid link.");
    } else {
      fetch(`/api/share/${encodeURIComponent(token)}`, { cache: "no-store" })
        .then(res => {
          if (!res.ok) throw new Error("Not found");
          return res.json();
        })
        .then(data => {
          const expiresAt = data.expiresAt ? new Date(data.expiresAt) : null;
          const remainingMs = expiresAt ? expiresAt - Date.now() : 0;

          if (expiresAt && remainingMs <= 0) {
            fail("This link has expired.");
            return;
          }

          const days = expiresAt
            ? Math.max(0, Math.ceil(remainingMs / (1000 * 60 * 60 * 24)))
            : null;

          const fileLabel = `${data.fileCount} file${data.fileCount === 1 ? "" : "s"}`;

          metaEl.textContent = days !== null
            ? `${fileLabel} • Expires in ${days} day${days === 1 ? "" : "s"}`
            : fileLabel;

          statEl.textContent = `${data.downloads} download${data.downloads === 1 ? "" : "s"} so far`;
          statEl.style.display = "inline-block";

          btn.href = `/api/download/${encodeURIComponent(data.jobId)}`;
          btn.removeAttribute("disabled");
        })
        .catch(() => {
          fail("The owner may have removed it.");
        });
    }
  </script>
</body>
</html>
